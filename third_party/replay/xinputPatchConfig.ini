; Settings of M1kou's replay patch (EXVSReplay.dll), written by the EXVS Launcher.
; Read once when the game starts. 1 = on, 0 = off.

[InputFix]
; Input blocking while the game isn't focused: off, the EXVS Overlay does it.
Enabled = 0
BlockKeyboard = 1
BlockXInput = 1
BlockRawInput = 1

[Replay]
; Clients keep their own copy of the replay (off = only the elected machine).
SaveReplayOnClient = 1
; Clients read the replay list once at startup.
FixReplayList = 1
; Live Monitor only: adds loose .bin replays to replay_list.json at startup.
AutoRegisterReplayBins = 1
; Detailed log in xinputPatch.log, for troubleshooting.
ReplayDiagnostics = 0
; Save replays after the arcade's closing time too.
SaveReplayOnCloseTime = 1
; Developer options, keep 0: record matches with CPUs (2 humans or fewer), every machine sends to the LM.
RecordCpuMatch = 0
ForceElected = 0

[DevMenu]
EnableDebugInPcb = 0

[TimeRental]
; Time rental free play bypass: off.
BypassTimeRentalFreePlay = 0
